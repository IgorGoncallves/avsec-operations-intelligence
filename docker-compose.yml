services:

  postgres:
    image: postgres:16
    container_name: avsec-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    image: avsec-airflow:3.3.1
    container_name: avsec-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment: &airflow-common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      PYTHONPATH: "/opt/airflow"

    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate


  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile

    image: avsec-airflow:3.3.1
    container_name: avsec-airflow-apiserver

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      <<: *airflow-common-env

    volumes:
      *airflow-common-volumes

    command: api-server

    ports:
      - "8080:8080"

    restart: always


  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    image: avsec-airflow:3.3.1
    container_name: avsec-airflow-scheduler

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      <<: *airflow-common-env

    volumes:
      *airflow-common-volumes

    command: scheduler

    restart: always


  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    image: avsec-airflow:3.3.1
    container_name: avsec-airflow-dag-processor

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      <<: *airflow-common-env

    volumes:
      *airflow-common-volumes

    command: dag-processor

    restart: always


volumes:
  postgres-db-volume: